name: Deep Binary Analysis

on:
  workflow_dispatch:

jobs:
  ghidra:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      _JAVA_OPTIONS: "-Xmx4g -Xms1g"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Ghidra
        id: cache-ghidra
        uses: actions/cache@v4
        with:
          path: ghidra
          key: ghidra-11.0.3

      - name: Install Ghidra
        if: steps.cache-ghidra.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.0.3_build/ghidra_11.0.3_PUBLIC_20240410.zip
          unzip -q ghidra_*.zip -d ghidra

      - name: Run Ghidra Headless
        run: |
          mkdir -p ghidra_project ghidra_output
          ./ghidra/ghidra_*/support/analyzeHeadless ghidra_project MyProject \
            -import lib.so \
            -processor ARM:LE:32:v7 \
            -cspec gcc \
            -scriptPath scripts \
            -postScript ghidra_export_deep.py \
            -deleteProject

      - uses: actions/upload-artifact@v4
        with:
          name: ghidra-results
          path: ghidra_output/

  angr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install angr
        run: pip install angr

      - name: Run angr Analysis
        run: python scripts/angr_analysis.py lib.so

      - uses: actions/upload-artifact@v4
        with:
          name: angr-results
          path: angr_output/

  string-usage:
    needs: ghidra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ghidra-results
          path: ghidra_output/

      - name: Run String Usage Analysis
        run: python scripts/find_string_usage.py ghidra_output string_usage_output
        env:
          TARGET_ADDR: "004cdc46"

      - uses: actions/upload-artifact@v4
        with:
          name: string-usage-results
          path: string_usage_output/

  merge:
    needs: [ghidra, angr, string-usage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Merge results
        run: |
          python scripts/merge_results.py artifacts/
          ls -la merged_output/

      - uses: actions/upload-artifact@v4
        with:
          name: merged-analysis
          path: merged_output/
