name: Deep Binary Analysis (Ghidra + angr)

on:
  push:
  workflow_dispatch:

jobs:
  ghidra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ghidra
        run: |
          wget -q https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.0.3_build/ghidra_11.0.3_PUBLIC_20240410.zip
          unzip -q ghidra_*.zip -d ghidra

      - name: Run Ghidra Headless
        run: |
          mkdir -p ghidra_project ghidra_output
          ./ghidra/ghidra_*/support/analyzeHeadless ghidra_project MyProject \
            -import lib.so \
            -scriptPath scripts \
            -postScript ghidra_export_deep.py \
            -deleteProject

      - uses: actions/upload-artifact@v4
        with:
          name: ghidra-results
          path: ghidra_output/

  angr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install angr
        run: pip install angr

      - name: Run angr Analysis
        run: python scripts/angr_analysis.py lib.so

      - uses: actions/upload-artifact@v4
        with:
          name: angr-results
          path: angr_output/

  merge:
    needs: [ghidra, angr]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Merge results
        run: |
          python scripts/merge_results.py artifacts/
          ls -la merged_output/

      - uses: actions/upload-artifact@v4
        with:
          name: merged-analysis
          path: merged_output/
